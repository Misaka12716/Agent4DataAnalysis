id: user_tools_matching
type: user
description: 对话第5轮输入，根据每个worker的任务描述，从可用工具中筛选这一Worker可能需要用到的工具
zh: |
  请基于下面的已知信息，完成工具筛选任务，严格遵守输出格式要求：
  - 核心要求：从工具列表中选出1个或多个能覆盖任务核心流程/细分领域的工具
  - 已知信息：
    1. Worker任务描述：{worker_task_desc}
    2. 可用工具列表（格式：工具编号.工具名称.简要描述）：
  {tools_info}
  - 输出格式（必须严格遵守，否则无效）：
    1. 整体为多行文本，每行为1个筛选出的工具名称
    2. 无需额外文本，仅输出筛选结果行
en: |
  Please complete the tool filtering task based on the following known information and strictly follow the output format requirements:
  - Core requirement: Select one or more tools from the tool list that can cover the core process/specialized areas of the task, and distinguish between "required tools" and "optional tools"
  - Known information:
    1. Worker task description: {worker_task_desc}
    2. Available tools list (format: Number.Tool Name.Brief Description):
       {tools_info}
  - Output format (must be strictly followed, otherwise invalid):
    1. Overall, it is multi-line text. Each line corresponds to one selected tool, with a fixed format: 「Number.Tool Name.Brief Description」
    2. No additional text, only output the filtered result lines