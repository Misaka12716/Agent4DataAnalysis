id: user_knowledge_retrieval
type: user
description: 对话第3轮输入，要求Assistant从知识库获取需求相关知识（预留模块）
zh: |
  请根据下面需求，从知识库检索相关知识。
  已知信息：
  - 需求：{structured_req}
  - 检索范围：{knowledge_scope}
  输出要求：
  1. 检索与需求相关的知识；
  2. 按“知识类别-内容摘要-适用场景”格式整理；
  3. 无相关知识时返回“未检索到匹配知识”。
en: |
  Please retrieve knowledge relevant to the requirement from the knowledge base.
  Known Information:
  - Requirement: {structured_req}
  - Retrieval Scope: {knowledge_scope} 
  Output Requirements:
  1. Retrieve knowledge relevant to the requirement (e.g., technical specifications, data formats, solutions);
  2. Organize in the format "Knowledge Category - Content Summary - Application Scenario";
  3. Return "No matching knowledge retrieved" if no relevant knowledge exists.