id: user_exp_search
type: user
description: 对话第2轮输入，要求Assistant将用户需求与过往单个经验逐一对比，分析相似度并总结
zh: |
  请将结构化需求与过往任务历史逐一对比，分析相似度并总结核心关联。
  已知：
  - 需求：{structured_req}
  - 过往任务历史：{task_history}
  输出要求：
  1. 严格以**JSON类型**输出，字段不可缺失、不可新增，值均为字符串类型；
  2. 对象字段规范：
    {{
      "experience_id": "[经验ID]",
      "similarity": "[相似度百分比（保留整数）]",
      "core_content": "[相似点总结，相似度＜70%时填空字符串]"
    }}
  注意：**JSON语法必须严格正确**，关键信息需加粗。

en: |
  Please compare the structured requirements with the historical task records one by one, analyze the similarity, and summarize the core connections.
  Given:
  - Requirements: {structured_req}
  - Historical task records: {task_history}
  Output Requirements:
  1. Strictly output in **JSON type**. Fields shall not be missing or added, and all values shall be string type.
  2. Object field specifications:
    {{
      "experience_id": "[Experience ID]",
      "similarity": "[Similarity percentage (integer retained)]",
      "core_content": "[Summary of similarities; fill in empty string if similarity ＜ 70%]"
    }}
  Note: **JSON syntax must be strictly correct**, and key information should be bolded.