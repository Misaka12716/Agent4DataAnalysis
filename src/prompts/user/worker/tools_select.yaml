id: user_tool_matching
type: user
description: 对话第5轮输入，根据每个worker的任务描述，要求Assistant从可用工具中筛选这一Worker可能需要用到的工具
zh: |
  请基于下面Worker的任务描述，从工具类别列表中，筛选出能覆盖任务核心流程或细分领域的工具类别。
  - 已知信息：
  1. Worker任务描述：{worker_task_desc}
  2. 工具类别列表：{tools_categories}
  3. 各类别内容：{categories_content}
  - 输出格式：
  1. 输出格式必须是一个**JSON数组**，每个元素为一个工具类别的描述；
  2. 每个类别描述对象必须包含以下字段（字段不缺失、无冗余，类型严格匹配）：
  {{
    "categoryName": "工具类别名称"
    "type": "筛选类型（必选/可选）"
    "reason": "匹配理由（说明类别对任务的支撑作用）"
  }}
  3. 仅返回JSON数组，无任何额外文字。
  - 输出结果示例：
  [
    {{
      "categoryName": "数据预处理",
      "type": "必选",
      "reason": "任务需要对数据进行清洗、转换、分析等处理"
    }},
    {{
      "categoryName": "数据加载",
      "type": "可选",
      "reason": "任务可能需要读取或写入数据"
    }}
  ]
en: |
  Based on the task description provided for Worker below, please filter the tool categories from the list to identify those that can cover the core process or specialized areas of the task.
  - Known information:
  1. Worker task description: {worker_task_desc}
  2. Tool category list: {tools_categories}
  3. Various categories of content: {categories_content}
  - Output format:
  The output format must be a **JSON array**, with each element representing a description of a tool category;
  2. Each category description object must contain the following fields (with no missing or redundant fields, and strict type matching):
  {{
    "categoryName": "Tool category name"
    "type": "Filter type (required/optional)"
    "reason": "Matching reason (describing the supporting role of the category to the task)"
  }}
  3. Only return a JSON array, without any additional text.
  - Example output result:
  [
    {{  
      "categoryName": "DATACLEANING",
      "type": "required",
      "reason": "The task requires data cleaning, transformation, analysis, and other processing"
    }},
    {{
      "categoryName": "TABULARLOADER",
      "type": "optional",
      "reason": "The task may require reading or writing data"
    }}
  ]