[pytest]
testpaths = tests
pythonpath = src
markers =
    integration: tests that may need external services (e.g. Cube Sandbox); live cases still gated by RUN_CUBE_SANDBOX_INTEGRATION
# Default: exclude live sandbox tests. Run all including live with:
#   RUN_CUBE_SANDBOX_INTEGRATION=1 pytest tests/ -k live
# Full suite without live:
#   pytest tests/ -k "not live"
